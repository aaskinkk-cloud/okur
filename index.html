<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Okur &amp; Bütçe</title>
<meta name="surum" content="104" data-ad="Okur &amp; Bütçe" data-tarih="01.11.2026">
<meta name="theme-color" content="#eef0ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Okur & Bütçe — iki uygulamayı tek çatı altında toplayan kabuk.
   Okur (okur.html) ve Bütçe & Hedef (butce.html) kendi çerçevelerinde, tüm işlevleriyle çalışır;
   aynı adreste oldukları için kitaplar, alıntılar ve bütçe kayıtları ortak depodadır. */
:root{--kam:0px;--bg:#eef0ea;--fg:#1d2a24;--kart:#fff;--acc:#1e6b63;--ustH:60px;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);transition:background-color .25s}
.ust{position:fixed;left:0;right:0;top:0;z-index:5;box-sizing:border-box;padding:calc(var(--kam) + 9px) 14px 9px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--fg);transition:transform .28s cubic-bezier(.3,.9,.3,1),background-color .25s,color .25s;
  box-shadow:0 1px 0 color-mix(in srgb,var(--fg) 7%,transparent);-webkit-user-select:none;user-select:none}
body.okumada .ust{transform:translateY(-110%)}
.sec{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(440px,100%);padding:4px;border-radius:999px;
  background:color-mix(in srgb,var(--fg) 7%,transparent);box-shadow:inset 0 1px 2px color-mix(in srgb,var(--fg) 10%,transparent)}
.sec button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:0;padding:0 10px;border:0;border-radius:999px;
  background:none;color:color-mix(in srgb,var(--fg) 58%,transparent);font-family:inherit;font-weight:600;font-size:14.5px;line-height:1;letter-spacing:.005em;cursor:pointer;transition:color .2s;white-space:nowrap}
.sec button span{overflow:hidden;text-overflow:ellipsis}
.sec button[aria-selected="true"]{color:var(--fg)}
.sec svg{flex:none;width:19px;height:19px;transition:color .2s,transform .3s}
.sec button[aria-selected="true"] svg{color:var(--acc);transform:scale(1.06)}
.sec .kay{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--kart);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px rgba(0,0,0,.25);transition:transform .34s cubic-bezier(.3,.9,.3,1),background-color .25s}
.sec[data-s="butce"] .kay{transform:translateX(100%)}
.sec button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
iframe{position:fixed;left:0;right:0;bottom:0;top:var(--ustH);width:100%;height:calc(100% - var(--ustH));border:0;background:var(--bg);transition:opacity .18s}
iframe.pasif{visibility:hidden;pointer-events:none;opacity:0}
body.okumada #fOkur{top:0;height:100%}
.yuk{position:fixed;inset:var(--ustH) 0 0;display:grid;place-items:center;color:color-mix(in srgb,var(--fg) 55%,transparent);font-size:14px;pointer-events:none;transition:opacity .3s}
.yuk.bitti{opacity:0}
.yuk i{display:block;width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid color-mix(in srgb,var(--acc) 25%,transparent);border-top-color:var(--acc);animation:don 0.8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
#obUpd{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;background:#111;color:#fff;padding:10px 10px 10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;font:600 14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#obUpd button{border:0;border-radius:10px;padding:8px 14px;font:inherit;background:#fff;color:#111;cursor:pointer}
</style>
</head>
<body>
<header class="ust" id="ust">
  <div class="sec" id="sec" role="tablist" aria-label="Uygulama" data-s="okur">
    <span class="kay" aria-hidden="true"></span>
    <button role="tab" id="tOkur" data-k="okur" aria-selected="true" aria-controls="fOkur">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>
      <span>Okur</span></button>
    <button role="tab" id="tButce" data-k="butce" aria-selected="false" aria-controls="fButce">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M7 6V5a2 2 0 0 1 2-2h8"/><circle cx="16.5" cy="14.5" r="1.3" fill="currentColor"/></svg>
      <span>Bütçe &amp; Hedef</span></button>
  </div>
</header>
<div class="yuk" id="yuk"><div><i></i>Açılıyor…</div></div>
<iframe id="fOkur" data-src="okur.html" title="Okur" allow="fullscreen; clipboard-read; clipboard-write; autoplay"></iframe>
<iframe id="fButce" class="pasif" data-src="butce.html" title="Bütçe &amp; Hedef" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<script>
/* Çerçevedeki uygulamalar bu işarete bakar: Milli Emlak gömülü modu kapalı kalır, sürüm/önbellek işini kabuk yapar. */
window.OB_KABUK=true;
(function(){
  'use strict';
  const $=s=>document.querySelector(s),R=document.documentElement,body=document.body;
  const F={okur:$('#fOkur'),butce:$('#fButce')},T={okur:$('#tOkur'),butce:$('#tButce')};
  const SK='okurButce.sekme';
  let akt=(new URLSearchParams(location.search).get('app')||'').toLowerCase();
  if(!F[akt]){try{akt=localStorage.getItem(SK)||'okur'}catch(e){akt='okur'}}
  if(!F[akt])akt='okur';

  /* ---- ön kamera boşluğu (Android uygulaması --kamera değişkenini bu sayfaya yazar) ---- */
  const kamOku=()=>(R.style.getPropertyValue('--kamera')||'').trim()||'0px';
  let kam=kamOku();
  const ustOlc=()=>{R.style.setProperty('--kam',kam);R.style.setProperty('--ustH',($('#ust').offsetHeight||60)+'px')};

  /* ---- renk: üst bant etkin uygulamanın zeminini alır; Android kabuğuna da bu renk bildirilir ---- */
  const hex=c=>{const m=String(c).match(/rgba?\(([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)(?:[ ,/]+([\d.]+))?/);if(!m)return/^#/.test(c)?c:null;if(m[4]!==undefined&&+m[4]===0)return null;
    return'#'+[m[1],m[2],m[3]].map(x=>Math.round(+x).toString(16).padStart(2,'0')).join('')};
  const parlak=h=>{const n=parseInt(h.slice(1),16);return(((n>>16)&255)*299+((n>>8)&255)*587+(n&255)*114)/1000};
  function zemin(doc){try{const w=doc.defaultView;for(const el of[doc.body,doc.documentElement]){const h=hex(w.getComputedStyle(el).backgroundColor);if(h)return h}}catch(e){}return null}
  function vurgu(doc){try{const cs=doc.defaultView.getComputedStyle(doc.documentElement);for(const v of['--accent','--acc','--brand','--primary','--ana']){const x=cs.getPropertyValue(v).trim();if(x)return x}}catch(e){}return null}
  function renk(){
    const f=F[akt],doc=f.contentDocument;if(!doc||!doc.body)return;
    let bg=zemin(doc)||'#eef0ea';const koyu=parlak(bg)<128;
    R.style.setProperty('--bg',bg);R.style.setProperty('--fg',koyu?'#eef2ee':'#1d2a24');
    R.style.setProperty('--kart',koyu?'rgba(255,255,255,.14)':'#ffffff');R.style.colorScheme=koyu?'dark':'light';
    const v=vurgu(doc);if(v)R.style.setProperty('--acc',v);
    let tc=bg;
    if(body.classList.contains('okumada')){try{const m=doc.querySelector('meta[name=theme-color]');if(m&&m.content)tc=m.content}catch(e){}}
    const meta=$('meta[name=theme-color]');if(meta.content!==tc)meta.content=tc;
  }

  /* ---- Okur'da kitap açıkken üst bant gizlenir, kitap tam ekranı kullanır ---- */
  function okumaKontrol(){
    let ok=false;try{const d=F.okur.contentDocument;ok=akt==='okur'&&!!(d&&d.body&&d.body.classList.contains('reading'))}catch(e){}
    if(ok!==body.classList.contains('okumada')){body.classList.toggle('okumada',ok);kamDagit();setTimeout(renk,30)}
  }
  function kamDagit(){
    /* Okur kitapta kendi kamera boşluğunu kullanır; kitaplıkta ve Bütçe'de boşluğu üst bant karşılar */
    try{const d=F.okur.contentDocument,w=F.okur.contentWindow;if(d){d.documentElement.style.setProperty('--kamera',body.classList.contains('okumada')?kam:'0px');
      try{w.RUI&&w.RUI.open&&w.RUI.vfit()}catch(e){}}}catch(e){}
    try{const d=F.butce.contentDocument;if(d)d.documentElement.style.setProperty('--kamera','0px')}catch(e){}
  }

  /* ---- çerçeve hazırlığı: Android'de indirmeler (yedek, dışa aktarım) uygulama üzerinden kaydedilir ---- */
  function hazirla(k){
    const f=F[k];let w,d;try{w=f.contentWindow;d=f.contentDocument}catch(e){return}if(!w||!d)return;
    try{if(window.OkurAndroid&&!w.__okurIndir){w.__okurIndir=1;const o=w.HTMLAnchorElement.prototype.click;
      w.HTMLAnchorElement.prototype.click=function(){const h=this.href||'',ad=this.getAttribute('download');
        if(ad!==null&&/^(blob:|data:)/.test(h)&&w.OkurAndroid){w.fetch(h).then(r=>r.blob()).then(b=>{const fr=new w.FileReader();fr.onload=()=>{const s=String(fr.result),i=s.indexOf(',');
          w.OkurAndroid.kaydet(ad||'okur-butce-dosya',b.type||'',s.slice(i+1))};fr.readAsDataURL(b)});return}
        return o.apply(this,arguments)}}}catch(e){}
    try{const mo=new w.MutationObserver(()=>{if(k==='okur')okumaKontrol();if(k===akt)renkGec()});
      mo.observe(d.body,{attributes:true,attributeFilter:['class','style']});mo.observe(d.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
      mo.observe(d.head,{subtree:true,attributes:true,childList:true,attributeFilter:['content']})}catch(e){}
    kamDagit();if(k===akt){renk();$('#yuk').classList.add('bitti')}
    if(k==='okur')okumaKontrol();
  }
  let _rt=0;const renkGec=()=>{clearTimeout(_rt);_rt=setTimeout(renk,60)};
  function yukle(k){const f=F[k];if(!f.getAttribute('src')){f.addEventListener('load',()=>hazirla(k));f.src=f.dataset.src}}

  /* ---- sekme değiştir ---- */
  function sec(k){
    if(!F[k])return;akt=k;try{localStorage.setItem(SK,k)}catch(e){}
    $('#sec').dataset.s=k;for(const x in F){const a=x===k;F[x].classList.toggle('pasif',!a);T[x].setAttribute('aria-selected',a);T[x].tabIndex=a?0:-1}
    yukle(k);okumaKontrol();renk();
    if(k==='butce'){try{const w=F.butce.contentWindow;w.okurAl&&w.okurAl()}catch(e){}}  /* Okur'daki yeni alıntılar hemen gelsin */
    try{F[k].contentWindow.focus()}catch(e){}
  }
  for(const x in T)T[x].addEventListener('click',()=>sec(x));
  $('#sec').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();sec(akt==='okur'?'butce':'okur');T[akt].focus()}});

  /* ---- başlat: önce açık sekme, sonra diğeri (geçiş anında olsun) ---- */
  ustOlc();sec(akt);
  setTimeout(()=>yukle(akt==='okur'?'butce':'okur'),1800);
  addEventListener('resize',ustOlc);
  new MutationObserver(()=>{const y=kamOku();if(y!==kam){kam=y;ustOlc();kamDagit()}}).observe(R,{attributes:true,attributeFilter:['style']});
  /* Bütçe'nin "ana sayfa" düğmesi kabukta Okur'a döner */
  window.modulKapat=()=>sec('okur');

  /* ---- çevrimdışı önbellek ve "Yeni sürüm hazır" (tek yerden) ---- */
  const swOk=(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))&&('serviceWorker' in navigator)&&!/claude|googleusercontent|script\.google/.test(location.hostname);
  if(swOk){let had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg=>{setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
      let son=0;const kontrol=()=>{if(Date.now()-son<60000)return;son=Date.now();
        fetch('sw.js?k='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const x=/V=P\+'(\d+)'/.exec(t||'');const bu=parseInt($('meta[name=surum]').content,10)||0;
          if(x&&+x[1]>bu){reg.update().catch(()=>{});setTimeout(()=>{if(!$('#obUpd'))afis()},8000)}}).catch(()=>{})};
      kontrol();document.addEventListener('visibilitychange',()=>{if(!document.hidden)kontrol()})}).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}afis()});
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  function afis(){if($('#obUpd'))return;const b=document.createElement('div');b.id='obUpd';b.setAttribute('role','status');
    b.innerHTML='<span>Yeni sürüm hazır</span><button type="button">Yenile</button>';b.querySelector('button').onclick=()=>location.reload();body.appendChild(b)}
})();
</script>
</body>
</html>
